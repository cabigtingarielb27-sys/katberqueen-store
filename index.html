<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queeny Store POS</title>
<meta name="theme-color" content="#ec4899">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fff8fc;--card:#ffffff;--ink:#3b1228;--ink2:#7a4a63;--muted:#ab7d97;
  --pink:#ec4899;--pink2:#db2777;--fuchsia:#d946ef;--line:#f8dbea;
  --green:#059669;--red:#e11d48;--amber:#d97706;
  --shadow:0 14px 30px -22px rgba(219,39,119,.65);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:48px;font-size:15px;
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 420px at 50% -8%, rgba(236,72,153,.13), transparent 62%)}
h1,h2,h3,p{margin:0}
a{color:inherit}
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,248,252,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1080px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
  background:linear-gradient(140deg,#f472b6,#db2777);box-shadow:0 10px 20px -12px rgba(219,39,119,.95);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.brand{font-weight:800;font-size:15px;line-height:1.15}
.brand small{display:block;font-weight:700;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hdr-tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pink2);
  background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.nav{max-width:1080px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2);border:1px solid var(--line);background:#fff}
.nav a.active{background:linear-gradient(135deg,var(--pink),var(--fuchsia));color:#fff;border-color:transparent;box-shadow:0 12px 22px -14px rgba(219,39,119,.95)}
main{max-width:1080px;margin:0 auto;padding:16px 14px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.h2{font-size:14px;font-weight:800}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;
  background:linear-gradient(135deg,#ec4899,#d946ef 55%,#db2777);box-shadow:0 22px 44px -26px rgba(219,39,119,.95)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.22);filter:blur(28px)}
.hero-label{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85);position:relative}
.hero-big{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:8px;position:relative;font-variant-numeric:tabular-nums}
.hero-row{display:flex;gap:18px;margin-top:14px;position:relative;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:8px}
.mini-ic{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:12px;font-weight:800}
.mini-label{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.mini-val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.kpi-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi-val{font-size:20px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #fdeef6;text-decoration:none}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.row-val{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.b-cash{background:#d1fae5;color:#065f46}
.b-utang{background:#fff0f7;color:#be185d;border:1px solid #fbcfdf}
.b-void{background:#fee2e2;color:#991b1b}
.b-in{background:#dbeafe;color:#1e40af}
.b-out{background:#fef3c7;color:#92400e}
.b-fund{background:#ede9fe;color:#5b21b6}
.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;padding:11px 16px;border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--fuchsia));color:#fff;box-shadow:0 14px 26px -16px rgba(219,39,119,.95)}
.btn-ghost{background:#fff;color:var(--pink2);border:1px solid var(--line)}
.btn-danger{background:#fee2e2;color:#b91c1c}
.btn-sm{padding:7px 11px;font-size:11.5px;border-radius:11px}
.btn-block{width:100%}
.input{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
.input:focus{border-color:#f9a8d4;box-shadow:0 0 0 4px rgba(236,72,153,.12)}
option{font-size:15px}
.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.empty{text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:22px 8px}
.err{color:var(--red);font-size:12px;font-weight:700;margin-top:8px;min-height:14px}
.tot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed #f5cfe2;font-weight:800}
.tot strong{font-size:20px;font-variant-numeric:tabular-nums}
.cashier{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:860px){.cashier{grid-template-columns:1fr 340px;align-items:start}}
.prod-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-top:12px}
.prod{appearance:none;cursor:pointer;text-align:left;font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;
  display:flex;flex-direction:column;gap:4px;min-height:82px;color:var(--ink)}
.prod:hover{border-color:#f9a8d4}
.prod.out{opacity:.45}
.prod-name{font-size:12.5px;font-weight:700;line-height:1.25}
.prod-price{font-size:14px;font-weight:800;color:var(--pink2);margin-top:auto}
.prod-stock{font-size:10px;font-weight:700;color:var(--muted)}
.cart-card{position:sticky;top:104px}
.cart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:#fff0f7;color:var(--pink2);padding:4px 9px;border-radius:999px;border:1px solid #fbcfdf}
.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #fdeef6}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--pink2);line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:800;font-size:13px}
.chip{background:#fff0f7;border:1px solid #fbcfdf;color:var(--pink2);font-weight:800;font-size:11.5px;padding:8px 11px;border-radius:11px;cursor:pointer;font-family:inherit}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:6px;margin:14px 0 4px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
.tab.active{background:linear-gradient(135deg,var(--pink),var(--fuchsia));color:#fff;border-color:transparent}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(59,18,40,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:680px){.overlay{align-items:center;padding:24px}}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:18px 18px 24px;max-height:92vh;overflow:auto;box-shadow:0 -14px 40px rgba(59,18,40,.22)}
@media(min-width:680px){.sheet{border-radius:26px;max-height:86vh}}
.m-title{font-size:17px;font-weight:800}
.m-text{font-size:13px;color:var(--ink2);font-weight:600;margin-top:6px;line-height:1.5}
.m-actions{display:flex;gap:8px;margin-top:18px}
.m-actions .btn{flex:1}
.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:#1f2937}
.r-head{text-align:center;margin-bottom:8px}
.r-head strong{font-size:15px;letter-spacing:.04em}
.r-small{font-size:10.5px;color:#6b7280;text-align:center;margin-top:2px}
.r-center{text-align:center;margin-top:8px}
.r-line{border-top:1px dashed #d1d5db;margin:10px 0}
.r-item{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.r-total{font-weight:800;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;
  background:#3b1228;color:#fff;font-size:12.5px;font-weight:700;padding:11px 16px;border-radius:14px;z-index:80;box-shadow:0 16px 30px -18px rgba(0,0,0,.7)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.auth{max-width:460px;margin:0 auto}
.hdr-user{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.foot{text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin-top:22px}
.hr{height:1px;background:#fdeef6;margin:12px 0}
@media print{
  body{background:#fff}
  .hdr,.nav,#view,.toast,.no-print{display:none !important}
  .overlay{position:static;display:block;background:#fff;padding:0}
  .sheet{box-shadow:none;border-radius:0;max-width:none;max-height:none;padding:0;overflow:visible}
}

<body>
<header class="hdr">
  <div class="hdr-in">
    <div class="logo"><img src="icon.png" alt="Queeny Store logo"></div>
    <div class="brand"><span id="brandName">Queeny Store</span><small>Point of Sale</small></div>
    <div class="hdr-tag">Offline</div>
    <div class="hdr-user" id="hdrUser" style="display:none">
      <span id="hdrUserName"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="view"></main>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script src="seed-data.js"></script>
<script>
/* ================= storage ================= */
var APP_KEY = 'queeny.';
function readStore(k, fb){ try{ var raw = localStorage.getItem(APP_KEY + k); return raw ? JSON.parse(raw) : fb; }catch(e){ return fb; } }
function writeStore(k, v){ try{ localStorage.setItem(APP_KEY + k, JSON.stringify(v)); }catch(e){ alert('Puno na ang storage ng device.'); } }

/* Cloud sync connection (naka-save sa localStorage) */
var CLOUD_DEFAULT = { url:'https://supabase.co', key:'', storeId:'main-store' };
var cloud = { url:CLOUD_DEFAULT.url, key:CLOUD_DEFAULT.key, storeId:CLOUD_DEFAULT.storeId };
var cloudMsg = '', cloudTimer = null;

var products = [], sales = [], accounts = [], utangTxns = [];
var settings = { storeName:'Queeny Store', managerCode:'3105', counter:1 };
var cart = [];
var ui = { cashierQ:'', productsQ:'' };
var payMethod = 'cash', payPaid = '', payAccount = '';

function loadAll(){
  products  = readStore('products', []);
  sales     = readStore('sales', []);
  accounts  = readStore('accounts', []);
  utangTxns = readStore('utang', []);
  gcash     = readStore('gcash', []);
  settings  = Object.assign({ storeName:'Queeny Store', managerCode:'3105', counter:1 }, readStore('settings', {}));
  cloud     = Object.assign({ url:CLOUD_DEFAULT.url, key:CLOUD_DEFAULT.key, storeId:CLOUD_DEFAULT.storeId }, readStore('cloud', {}));
  ensureDefaultUser();
  if(!readStore('seeded', false)) seed();
}
/* Dual-save: localStorage muna (100% offline), tapos background upload sa cloud. */
function persist(skipCloud){
  writeStore('products', products);
  writeStore('sales', sales);
  writeStore('accounts', accounts);
  writeStore('utang', utangTxns);
  writeStore('gcash', gcash);
  writeStore('settings', settings);
  if(!skipCloud) queueCloudSync();
}
function seed(){
  var d = window.SEED_DATA;
  if(d){
    products  = d.products  || [];
    sales     = d.sales     || [];
    accounts  = d.accounts  || [];
    utangTxns = d.utang     || [];
    gcash     = d.gcash     || [];
    if(d.settings) settings = Object.assign(settings, d.settings);
    persist();
    writeStore('seeded', true);
    return;
  }
  /* Walang seed-data.js: maliit na sample catalog lang ang ilalagay. */
  products = [
    { id:uid(), name:'Coke Sakto 200ml',        price:20, cost:15, stock:24, barcode:'4801981112345', category:'Beverage' },
    { id:uid(), name:'Lucky Me Pancit Canton',  price:16, cost:12, stock:40, barcode:'4800016000012', category:'Noodles' },
    { id:uid(), name:'Kopiko Black 3in1',       price:9,  cost:7,  stock:60, barcode:'8992753100011', category:'Coffee' },
    { id:uid(), name:'Skyflakes Crackers',      price:12, cost:9,  stock:30, barcode:'4800092660012', category:'Snacks' },
    { id:uid(), name:'Bear Brand 33g',          price:14, cost:11, stock:36, barcode:'4800361410017', category:'Milk' },
    { id:uid(), name:'Piattos Cheese 40g',      price:22, cost:17, stock:18, barcode:'4800016640012', category:'Snacks' }
  ];
  writeStore('products', products);
  writeStore('seeded', true);
}

/* ================= helpers ================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function peso(n){ return '\u20b1' + (Number(n)||0).toLocaleString('en-PH', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function fmtDate(iso){ var d = new Date(iso); return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' }); }
function fmtTime(iso){ var d = new Date(iso); return d.toLocaleTimeString('en-PH', { hour:'numeric', minute:'2-digit' }); }
function dayKey(iso){ var d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return dayKey(new Date().toISOString()); }
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
function $(sel, root){ return (root || document).querySelector(sel); }
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

/* ================= modal ================= */
function modal(html){
  document.getElementById('modal-root').innerHTML =
    '<div class="overlay" id="ovl"><div class="sheet">' + html + '</div></div>';
  var ovl = document.getElementById('ovl');
  ovl.addEventListener('click', function(e){ if(e.target === ovl) closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function askCode(message, cb){
  modal(
    '<h3 class="m-title">Manager Override</h3>' +
    '<p class="m-text">' + esc(message) + '</p>' +
    '<label class="lbl">Manager code</label>' +
    '<input id="mcode" class="input" type="password" inputmode="numeric" placeholder="****" autocomplete="off">' +
    '<p class="err" id="merr"></p>' +
    '<div class="m-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="checkCode()">Confirm</button></div>'
  );
  window.__codeCb = cb;
  var inp = document.getElementById('mcode');
  if(inp){ inp.focus(); }
}
function checkCode(){
  var v = (document.getElementById('mcode').value || '').trim();
  if(v !== String(settings.managerCode)){
    document.getElementById('merr').textContent = 'Mali ang manager code.';
    return;
  }
  var cb = window.__codeCb;
  window.__codeCb = null;
  closeModal();
  if(cb) cb();
}

/* ================= accounts (offline login) ================= */
var USERS_KEY = 'app_users';
var SESSION_KEY = 'currentUser';
var authTab = 'login';
var authMsg = '';

function loadUsers(){
  try{
    var raw = localStorage.getItem(USERS_KEY);
    var list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
function saveUsers(list){ try{ localStorage.setItem(USERS_KEY, JSON.stringify(list)); }catch(e){} }
function currentUser(){
  try{ var raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function setCurrentUser(u){
  try{
    if(u) localStorage.setItem(SESSION_KEY, JSON.stringify(u));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}
/* Default account para hindi ma-lock out kahit walang na-register. */
function ensureDefaultUser(){
  var users = loadUsers();
  if(users.length) return users;
  users = [{ id:uid(), name:'Store Admin', username:'admin', password:'1234', role:'Admin', created:new Date().toISOString() }];
  saveUsers(users);
  return users;
}
function setAuthTab(t){ authTab = t; authMsg = ''; render(); }
function setAuthMsg(msg){ authMsg = msg; var el = document.getElementById('authMsg'); if(el) el.textContent = msg; }
function loginFormHtml(){
  return '<form onsubmit="doLogin(event)">' +
    '<label class="lbl">Username</label>' +
    '<input id="lgUser" class="input" autocomplete="username" placeholder="admin">' +
    '<label class="lbl">Password / PIN</label>' +
    '<input id="lgPass" class="input" type="password" autocomplete="current-password" placeholder="****">' +
    '<p class="err" id="authErr"></p>' +
    '<button class="btn btn-primary btn-block" type="submit">Login</button>' +
  '</form>';
}
function registerFormHtml(){
  return '<form onsubmit="doRegister(event)">' +
    '<label class="lbl">Full Name</label>' +
    '<input id="rgName" class="input" autocomplete="name">' +
    '<label class="lbl">Username</label>' +
    '<input id="rgUser" class="input" autocomplete="username">' +
    '<label class="lbl">Password / 4-digit PIN</label>' +
    '<input id="rgPass" class="input" type="password" autocomplete="new-password">' +
    '<label class="lbl">Role</label>' +
    '<select id="rgRole" class="input"><option>Admin</option><option>Staff</option></select>' +
    '<p class="err" id="authErr"></p>' +
    '<button class="btn btn-primary btn-block" type="submit">Create Account</button>' +
  '</form>';
}
function viewAuth(){
  return '<div class="auth">' +
  '<div class="page-head"><div><h1 class="h1">' + (authTab === 'login' ? 'Login' : 'Register') + '</h1>' +
    '<p class="sub">' + esc(settings.storeName || 'Queeny Store') + ' \u00b7 Offline POS</p></div></div>' +
  '<div class="card">' +
    '<div class="tabs" style="margin-top:0">' +
      '<button class="tab' + (authTab === 'login' ? ' active' : '') + '" onclick="setAuthTab(\'login\')">Login</button>' +
      '<button class="tab' + (authTab === 'register' ? ' active' : '') + '" onclick="setAuthTab(\'register\')">Register</button>' +
    '</div>' +
    (authTab === 'login' ? loginFormHtml() : registerFormHtml()) +
  '</div>' +
  '<div class="card"><h2 class="h2">Sync Accounts from Cloud</h2>' +
    '<p class="m-text">Para makapag-login sa bagong device, i-download ang mga account mula sa Supabase.</p>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="syncAccounts()">Sync Accounts from Cloud</button>' +
    '<p class="row-sub" id="authMsg" style="margin-top:8px">' + esc(authMsg || '') + '</p>' +
  '</div>' +
  '<p class="foot">' + loadUsers().length + ' account(s) sa device na ito</p>' +
  '</div>';
}
function doLogin(e){
  e.preventDefault();
  var uname = (document.getElementById('lgUser').value || '').trim().toLowerCase();
  var pass  = (document.getElementById('lgPass').value || '').trim();
  var hit = loadUsers().filter(function(x){
    return String(x.username || '').toLowerCase() === uname && String(x.password || '') === pass;
  })[0];
  if(!hit){ document.getElementById('authErr').textContent = 'Mali ang username o password.'; return; }
  setCurrentUser({ id:hit.id, name:hit.name, username:hit.username, role:hit.role });
  authMsg = '';
  cart = [];
  ui.cashierQ = ''; ui.productsQ = '';
  render();
  toast('Kumusta, ' + (hit.name || hit.username) + '!');
}
function doRegister(e){
  e.preventDefault();
  var name  = (document.getElementById('rgName').value || '').trim();
  var uname = (document.getElementById('rgUser').value || '').trim();
  var pass  = (document.getElementById('rgPass').value || '').trim();
  var errEl = document.getElementById('authErr');
  if(!name || !uname || !pass){ errEl.textContent = 'Kailangan ang pangalan, username at password.'; return; }
  if(pass.length < 4){ errEl.textContent = 'Hindi bababa sa 4 na karakter ang password/PIN.'; return; }
  var users = loadUsers();
  if(users.some(function(x){ return String(x.username || '').toLowerCase() === uname.toLowerCase(); })){
    errEl.textContent = 'May account na ang username na ito.';
    return;
  }
  var user = { id:uid(), name:name, username:uname, password:pass, role:document.getElementById('rgRole').value, created:new Date().toISOString() };
  users.push(user);
  saveUsers(users);
  setCurrentUser({ id:user.id, name:user.name, username:user.username, role:user.role });
  authTab = 'login'; authMsg = '';
  render();
  toast('Na-register at naka-login na.');
  queueCloudSync();
}
function logout(){
  setCurrentUser(null);
  cart = [];
  authTab = 'login';
  authMsg = '';
  render();
  toast('Naka-logout ka na.');
}
function syncAccounts(){
  if(!cloudReady()){ setAuthMsg('I-set muna ang Supabase URL at Publishable Key sa Cloud Sync tab (pagkatapos mag-login).'); return; }
  if(!navigator.onLine){ setAuthMsg('Walang internet \u2014 hindi maka-sync.'); return; }
  setAuthMsg('Nag-sync ng accounts\u2026');
  var url = cloudBase() + '/rest/v1/store_sync?id=eq.' + encodeURIComponent(cloud.storeId) + '&select=*';
  fetch(url, { headers: { 'apikey': cloud.key, 'Authorization': 'Bearer ' + cloud.key } })
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(rows){
      var local = loadUsers(), added = 0;
      (rows || []).forEach(function(row){
        var incoming = (row && row.data && row.data.users) || [];
        incoming.forEach(function(u){
          if(!u || !u.username) return;
          if(local.some(function(x){ return String(x.username || '').toLowerCase() === String(u.username).toLowerCase(); })) return;
          local.push(u);
          added++;
        });
      });
      saveUsers(local);
      render();
      setAuthMsg(added + ' account(s) ang na-sync mula sa cloud.');
      toast(added + ' account(s) na-sync.');
    })
    .catch(function(err){
      setAuthMsg('Hindi na-sync: ' + ((err && err.message) || 'error'));
    });
}

var NAV = [
  ['dashboard', '\uD83C\uDFE0 Dashboard'],
  ['cashier',   '\uD83D\uDED2 Cashier'],
  ['utang',     '\uD83D\uDCD2 Utang'],
  ['sales',     '\uD83E\uDDFE Sales'],
  ['products',  '\uD83D\uDCE6 Products'],
  ['gcash',     '\uD83D\uDCB3 GCash'],
  ['cloud',     '\u2601\uFE0F Cloud Sync'],
  ['settings',  '\u2699\uFE0F Settings']
];
function navHtml(active){
  return NAV.map(function(n){
    return '<a href="#/' + n[0] + '" class="' + (n[0] === active ? 'active' : '') + '">' + n[1] + '</a>';
  }).join('');
}
function render(){
  var me = currentUser();
  var navEl = document.getElementById('nav');
  var userEl = document.getElementById('hdrUser');
  document.getElementById('brandName').textContent = settings.storeName || 'Queeny Store';
  if(navEl) navEl.style.display = me ? 'flex' : 'none';
  if(userEl) userEl.style.display = me ? 'flex' : 'none';
  if(me && document.getElementById('hdrUserName')){
    document.getElementById('hdrUserName').textContent = (me.name || me.username) + ' \u00b7 ' + (me.role || 'Staff');
  }

  /* Walang naka-login: Login / Register screen muna. */
  if(!me){
    document.getElementById('view').innerHTML = viewAuth();
    return;
  }

  var hash = (location.hash || '#/dashboard').replace(/^#/, '');
  var parts = hash.split('/').filter(Boolean);
  var r = parts[0] || 'dashboard';
  var html = '';
  if(r === 'cashier') html = viewCashier();
  else if(r === 'utang') html = parts[1] ? viewAccount(parts[1]) : viewUtang();
  else if(r === 'sales') html = viewSales();
  else if(r === 'products') html = viewProducts();
  else if(r === 'gcash') html = viewGcash();
  else if(r === 'cloud') html = viewCloud();
  else if(r === 'settings') html = viewSettings();
  else html = viewDashboard();

  document.getElementById('brandName').textContent = settings.storeName || 'Queeny Store';
  document.getElementById('nav').innerHTML = navHtml((r === 'dashboard') ? 'dashboard' : r);
  document.getElementById('view').innerHTML = html;
}

/* ================= cashier ================= */
function filterProducts(q){
  var t = (q || '').toLowerCase().trim();
  if(!t) return products;
  return products.filter(function(p){
    return (p.name || '').toLowerCase().indexOf(t) >= 0
        || (p.barcode || '').indexOf(t) >= 0
        || (p.category || '').toLowerCase().indexOf(t) >= 0;
  });
}
function prodCard(p){
  var tracked = (p.stock || 0) > 0;
  return '<button class="prod" onclick="addToCart(\'' + p.id + '\')">' +
    '<span class="prod-name">' + esc(p.name) + '</span>' +
    '<span class="prod-price">' + peso(p.price) + '</span>' +
    '<span class="prod-stock">' + (tracked ? 'Stock ' + p.stock : 'Walang stock tracking') + '</span></button>';
}
function gridHtml(q){
  var list = filterProducts(q);
  return list.length ? list.map(prodCard).join('') : '<p class="empty">Walang nahanap na produkto.</p>';
}
function cashierSearch(v, el){
  ui.cashierQ = v;
  var box = document.getElementById('gridBox');
  if(box) box.innerHTML = gridHtml(v);
}
function cashierKey(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  var v = (e.target.value || '').trim();
  if(!v) return;
  var hit = products.filter(function(p){ return p.barcode === v; })[0];
  if(!hit){
    var list = filterProducts(v);
    if(list.length === 1) hit = list[0];
  }
  if(hit){
    addToCart(hit.id);
    ui.cashierQ = '';
    e.target.value = '';
    var box = document.getElementById('gridBox');
    if(box) box.innerHTML = gridHtml('');
  }
}
function cartTotal(){ return round2(cart.reduce(function(s,c){ return s + (c.price * c.qty); }, 0)); }
function cartCount(){ return cart.reduce(function(s,c){ return s + c.qty; }, 0); }
function addToCart(id){
  var p = products.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  var line = cart.filter(function(c){ return c.product_id === id; })[0];
  var inCart = line ? line.qty : 0;
  if((p.stock || 0) > 0 && inCart >= p.stock){ toast('Kulang ang stock.'); return; }
  if(line) line.qty += 1;
  else cart.push({ product_id:id, name:p.name, price:p.price, qty:1 });
  render();
}
function changeQty(id, delta){
  var p = products.filter(function(x){ return x.id === id; })[0];
  var line = cart.filter(function(c){ return c.product_id === id; })[0];
  if(!line) return;
  var next = line.qty + delta;
  if(next <= 0){ cart = cart.filter(function(c){ return c.product_id !== id; }); render(); return; }
  if(p && (p.stock || 0) > 0 && next > p.stock){ toast('Kulang ang stock.'); return; }
  line.qty = next;
  render();
}
function cartRow(c){
  return '<div class="cart-line"><div class="row-main"><p class="row-title">' + esc(c.name) + '</p>' +
    '<p class="row-sub">' + peso(c.price) + ' \u00d7 ' + c.qty + '</p></div>' +
    '<div class="qty"><button onclick="changeQty(\'' + c.product_id + '\',-1)">\u2212</button>' +
    '<span>' + c.qty + '</span>' +
    '<button onclick="changeQty(\'' + c.product_id + '\',1)">+</button></div>' +
    '<div class="row-val" style="min-width:66px">' + peso(c.price * c.qty) + '</div></div>';
}

function openCheckout(){
  if(!cart.length) return;
  payMethod = 'cash'; payPaid = ''; payAccount = '';
  modal('<h3 class="m-title">Bayaran \u00b7 ' + peso(cartTotal()) + '</h3>' +
    '<div class="tabs">' +
      '<button class="tab active" id="tabCash" onclick="setPayMethod(\'cash\')">Cash</button>' +
      '<button class="tab" id="tabUtang" onclick="setPayMethod(\'utang\')">Utang</button>' +
    '</div><div id="payBody"></div>');
  renderPayBody();
}
function setPayMethod(m){
  payMethod = m;
  var c = document.getElementById('tabCash'), u = document.getElementById('tabUtang');
  if(c && u){
    c.className = 'tab' + (m === 'cash' ? ' active' : '');
    u.className = 'tab' + (m === 'utang' ? ' active' : '');
  }
  renderPayBody();
}
function renderPayBody(){
  var body = document.getElementById('payBody');
  if(!body) return;
  var total = cartTotal();
  if(payMethod === 'cash'){
    body.innerHTML =
      '<label class="lbl">Halaga ng binayad</label>' +
      '<input class="input" id="paid" inputmode="decimal" value="' + esc(payPaid) + '" placeholder="0.00" oninput="onPaid(this.value)">' +
      '<div class="quick">' +
        [20,50,100,200,500,1000].map(function(v){ return '<button class="chip" onclick="setPaid(' + v + ')">' + peso(v) + '</button>'; }).join('') +
      '</div>' +
      '<div class="tot"><span>Sukli</span><strong id="changeVal">' + peso(Math.max(0, (Number(payPaid) || 0) - total)) + '</strong></div>' +
      '<p class="err" id="payErr"></p>' +
      '<div class="m-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="completeSale()">Tapusin</button></div>';
  } else {
    body.innerHTML =
      '<label class="lbl">Pumili ng utang account</label>' +
      '<select class="input" id="acct" onchange="payAccount=this.value">' +
        '<option value="">\u2014 Pumili ng account \u2014</option>' +
        accounts.map(function(a){ return '<option value="' + a.id + '">' + esc(a.name) + ' \u00b7 ' + peso(a.balance) + '</option>'; }).join('') +
      '</select>' +
      '<div class="tot"><span>Idadagdag sa utang</span><strong>' + peso(total) + '</strong></div>' +
      '<p class="err" id="payErr"></p>' +
      '<div class="m-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="completeSale()">I-record ang Utang</button></div>';
  }
}
function onPaid(v){
  payPaid = v;
  var total = cartTotal();
  var el = document.getElementById('changeVal');
  if(el) el.textContent = peso(Math.max(0, (Number(v) || 0) - total));
}
function setPaid(v){
  payPaid = String(v);
  var inp = document.getElementById('paid');
  if(inp) inp.value = payPaid;
  onPaid(payPaid);
}
function completeSale(){
  var total = cartTotal();
  if(!cart.length) return;
  var errEl = document.getElementById('payErr');
  var now = new Date().toISOString();
  var utangId = '';

  if(payMethod === 'utang'){
    if(!payAccount){ if(errEl) errEl.textContent = 'Pumili ng account.'; return; }
    var acct = accounts.filter(function(a){ return a.id === payAccount; })[0];
    if(!acct){ if(errEl) errEl.textContent = 'Hindi mahanap ang account.'; return; }
    acct.balance = round2((acct.balance || 0) + total);
    utangId = uid();
    utangTxns.push({
      id: utangId,
      account_id: acct.id,
      account_name: acct.name,
      type: 'purchase',
      amount: total,
      balance_after: acct.balance,
      items: cart.map(function(c){ return { product_id:c.product_id, name:c.name, unit_price:c.price, qty:c.qty, subtotal:round2(c.price * c.qty) }; }),
      note: '', voided: false, date: now
    });
  } else {
    var paid = Number(payPaid) || 0;
    if(paid < total){ if(errEl) errEl.textContent = 'Kulang ang bayad.'; return; }
  }

  var sale = {
    id: uid(),
    no: 'S' + String(settings.counter || 1).padStart(4, '0'),
    date: now,
    items: cart.map(function(c){ return { product_id:c.product_id, name:c.name, price:c.price, qty:c.qty, subtotal:round2(c.price * c.qty) }; }),
    subtotal: total,
    total: total,
    payment: payMethod,
    account_id: payMethod === 'utang' ? payAccount : '',
    account_name: payMethod === 'utang' ? (accounts.filter(function(a){ return a.id === payAccount; })[0] || {}).name || '' : '',
    amount_paid: payMethod === 'cash' ? (Number(payPaid) || 0) : total,
    change: payMethod === 'cash' ? round2((Number(payPaid) || 0) - total) : 0,
    utang_id: utangId,
    voided: false
  };
  cart.forEach(function(c){
    var p = products.filter(function(x){ return x.id === c.product_id; })[0];
    if(p && (p.stock || 0) > 0) p.stock = Math.max(0, p.stock - c.qty);
  });
  sales.push(sale);
  settings.counter = (settings.counter || 1) + 1;
  persist();

  cart = []; payPaid = ''; payAccount = '';
  closeModal();
  render();
  openReceipt(sale.id);
  toast('Nabenta! ' + peso(sale.total));
}

/* ================= sales ================= */
function viewSales(){
  var list = sales.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var valid = list.filter(function(s){ return !s.voided; });
  var tKey = todayKey();
  var todayTotal = round2(valid.filter(function(s){ return dayKey(s.date) === tKey; }).reduce(function(a,s){ return a + s.total; }, 0));
  var allTotal = round2(valid.reduce(function(a,s){ return a + s.total; }, 0));

  var byDay = {};
  list.forEach(function(s){ var k = dayKey(s.date); (byDay[k] = byDay[k] || []).push(s); });
  var days = Object.keys(byDay).sort().reverse();

  return '' +
  '<div class="page-head"><div><h1 class="h1">Sales</h1><p class="sub">Lahat ng benta at resibo</p></div>' +
  '<a class="btn btn-primary" href="#/cashier">Bagong Benta</a></div>' +
  '<div class="grid">' +
    '<div class="kpi"><p class="kpi-label">Benta Ngayon</p><p class="kpi-val sm">' + peso(todayTotal) + '</p></div>' +
    '<div class="kpi"><p class="kpi-label">All-time</p><p class="kpi-val sm">' + peso(allTotal) + '</p></div>' +
    '<div class="kpi"><p class="kpi-label">Transactions</p><p class="kpi-val">' + valid.length + '</p></div>' +
  '</div>' +
  (days.length ? days.map(function(k){
    return '<div class="card" style="margin-top:12px"><div class="cart-head"><h2 class="h2">' + fmtDate(k + 'T12:00:00') + '</h2>' +
      '<span class="pill">' + peso(byDay[k].filter(function(s){ return !s.voided; }).reduce(function(a,s){ return a + s.total; }, 0)) + '</span></div>' +
      byDay[k].map(function(s){
        return '<div class="row">' +
          '<div class="row-main" style="cursor:pointer" onclick="openReceipt(\'' + s.id + '\')">' +
            '<p class="row-title">' + esc(s.no) + ' \u00b7 ' + s.items.length + ' item(s) <span class="badge ' + (s.voided ? 'b-void' : (s.payment === 'utang' ? 'b-utang' : 'b-cash')) + '">' + (s.voided ? 'Voided' : (s.payment === 'utang' ? 'Utang' : 'Cash')) + '</span></p>' +
            '<p class="row-sub">' + fmtTime(s.date) + (s.payment === 'utang' ? ' \u00b7 ' + esc(s.account_name || '') : '') + '</p>' +
          '</div>' +
          '<div class="row-val">' + peso(s.total) + '</div>' +
          (!s.voided ? '<button class="btn btn-sm btn-danger" onclick="voidSale(\'' + s.id + '\')">Void</button>' : '') +
        '</div>';
      }).join('') + '</div>';
  }).join('') : '<div class="card" style="margin-top:12px"><p class="empty">Wala pang benta. Pumunta sa Cashier para magsimula.</p></div>');
}
function voidSale(id){
  askCode('I-void ang sale na ito? Ibabalik ang stock.', function(){
    var s = sales.filter(function(x){ return x.id === id; })[0];
    if(!s || s.voided) return;
    s.voided = true;
    s.items.forEach(function(i){
      var p = products.filter(function(x){ return x.id === i.product_id; })[0];
      if(p && (p.stock || 0) > 0) p.stock = p.stock + i.qty;
    });
    if(s.utang_id){
      var t = utangTxns.filter(function(x){ return x.id === s.utang_id; })[0];
      if(t && !t.voided){
        t.voided = true;
        var a = accounts.filter(function(x){ return x.id === t.account_id; })[0];
        if(a) a.balance = round2((a.balance || 0) - t.amount);
      }
    }
    persist();
    render();
    toast('Na-void na ang sale.');
  });
}

function saveProduct(e, id){
  e.preventDefault();
  var name = (document.getElementById('pfName').value || '').trim();
  var price = Number(document.getElementById('pfPrice').value);
  if(!name || !(price > 0)){ document.getElementById('pfErr').textContent = 'Kailangan ang pangalan at tamang presyo.'; return; }
  var data = {
    name: name,
    price: round2(price),
    cost: round2(document.getElementById('pfCost').value),
    stock: Number(document.getElementById('pfStock').value) || 0,
    barcode: (document.getElementById('pfBarcode').value || '').trim(),
    category: (document.getElementById('pfCategory').value || '').trim()
  };
  if(id){
    var p = products.filter(function(x){ return x.id === id; })[0];
    if(p) Object.assign(p, data);
  } else {
    data.id = uid();
    products.push(data);
  }
  persist(); closeModal(); render(); toast('Na-save ang produkto.');
}
function deleteProduct(id){
  var p = products.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  askCode('Burahin ang "' + p.name + '"?', function(){
    products = products.filter(function(x){ return x.id !== id; });
    persist(); render(); toast('Na-delete ang produkto.');
  });
}

/* ================= gcash ================= */
function gcashBalances(){
  var onCash = 0, onGcash = 0, profit = 0;
  gcash.filter(function(r){ return !r.voided; }).forEach(function(r){
    if(r.type === 'cash_in'){
      onGcash -= r.amount; onCash += (r.amount + (r.fee || 0)); profit += (r.fee || 0);
    } else if(r.type === 'cash_out'){
      onGcash += r.amount; onCash -= (r.amount - (r.fee || 0)); profit += (r.fee || 0);
    } else if(r.type === 'fund_add'){
      if(r.fund === 'on_cash') onCash += r.amount; else onGcash += r.amount;
    }
  });
  return { onCash: round2(onCash), onGcash: round2(onGcash), profit: round2(profit) };
}

        '<option value="cash_in">Cash In</option><option value="cash_out">Cash Out</option><option value="fund_add">Fund Add</option>' +
      '</select>' +
      '<label class="lbl">Halaga</label><input id="gcAmt" class="input" inputmode="decimal" placeholder="0.00" required>' +
      '<div id="gcFeeWrap"><label class="lbl">Fee</label><input id="gcFee" class="input" inputmode="decimal" placeholder="0.00"></div>' +
      '<div id="gcFundWrap" style="display:none"><label class="lbl">Pondo</label>' +
        '<select id="gcFund" class="input"><option value="on_cash">On Cash</option><option value="on_gcash">On GCash</option></select></div>' +
      '<label class="lbl">Note</label><input id="gcNote" class="input">' +
      '<p class="err" id="gcErr"></p>' +
      '<button class="btn btn-primary btn-block" style="margin-top:12px" type="submit">I-save</button>' +
    '</form></div>' +
  '<div class="card" style="margin-top:12px"><h2 class="h2">Records</h2>' +
    (list.length ? list.map(function(r){
      return '<div class="row">' +
        '<div class="row-main"><p class="row-title">' + labels[r.type] + ' <span class="badge ' + badges[r.type] + '">' + esc(r.fund === 'on_cash' ? 'On Cash' : 'On GCash') + '</span>' +
          (r.voided ? ' <span class="badge b-void">Voided</span>' : '') + '</p>' +
          '<p class="row-sub">' + fmtDate(r.date) + ' \u00b7 ' + fmtTime(r.date) + (r.note ? ' \u00b7 ' + esc(r.note) : '') + '</p></div>' +

function addGcash(e){
  e.preventDefault();
  var type = document.getElementById('gcType').value;
  var amt = round2(document.getElementById('gcAmt').value);
  if(!(amt > 0)){ document.getElementById('gcErr').textContent = 'Ilagay ang tamang halaga.'; return; }
  var fee = type === 'fund_add' ? 0 : round2(document.getElementById('gcFee').value);
  var fund = type === 'fund_add' ? document.getElementById('gcFund').value : 'on_gcash';
  gcash.push({
    id: uid(), type: type, fund: fund, amount: amt, fee: fee,
    note: (document.getElementById('gcNote').value || '').trim(),
    voided: false, date: new Date().toISOString()
  });
  persist(); render(); toast('Na-save ang GCash record.');
}
function voidGcash(id){
  askCode('I-void ang record na ito?', function(){
    var r = gcash.filter(function(x){ return x.id === id; })[0];
    if(!r) return;
    r.voided = true;
    persist(); render(); toast('Na-void na.');
  });
}

/* ================= cloud sync (Supabase via fetch) ================= */
function cloudBase(){ return String(cloud.url || '').replace(/\/+$/, ''); }
function cloudReady(){ return !!(cloudBase() && cloud.key && cloud.storeId); }
function localData(){
  return { products:products, sales:sales, accounts:accounts, utang:utangTxns, gcash:gcash, settings:settings, users:loadUsers() };
}
function setCloudMsg(msg){
  cloudMsg = msg;
  var el = document.getElementById('cloudMsg');
  if(el) el.textContent = msg;
}
function viewCloud(){
  return '' +
  '<div class="page-head"><div><h1 class="h1">Cloud Sync</h1><p class="sub">I-share ang data sa lahat ng device</p></div>' +
  '<span class="pill">' + (navigator.onLine ? 'Online' : 'Offline') + '</span></div>' +
  '<div class="card"><h2 class="h2">Connection Settings</h2>' +
    '<form onsubmit="saveCloud(event)">' +
      '<label class="lbl">Supabase URL</label>' +
      '<input id="cUrl" class="input" value="' + esc(cloud.url) + '" placeholder="https://xxxx.supabase.co">' +
      '<label class="lbl">Supabase Publishable Key</label>' +
      '<input id="cKey" class="input" value="' + esc(cloud.key) + '" placeholder="sb_publishable_...">' +
      '<label class="lbl">Store ID</label>' +
      '<input id="cStore" class="input" value="' + esc(cloud.storeId) + '" placeholder="main-store">' +
      '<button class="btn btn-primary btn-block" style="margin-top:12px" type="submit">Save Connection Settings</button>' +
    '</form>' +
    '<p class="row-sub" id="cloudMsg" style="margin-top:10px">' + esc(cloudMsg || 'Walang sync pa.') + '</p>' +
  '</div>' +
  '<div class="card"><h2 class="h2">Manual Sync</h2>' +
    '<p class="m-text">Naka-save agad sa device ang bawat pagbabago. Awtomatiko ring uma-upload sa cloud kapag may internet at may naka-save na key.</p>' +
    '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="cloudUpload(false)">Upload / Sync Local Data to Cloud</button>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="cloudDownload()">Download Prebuilt Data</button>' +
  '</div>' +
  '<div class="card"><h2 class="h2">Data sa Device</h2>' +
    '<p class="row-sub">' + products.length + ' products \u00b7 ' + sales.length + ' sales \u00b7 ' + accounts.length + ' accounts \u00b7 ' + utangTxns.length + ' utang records</p>' +
    '<p class="row-sub" style="margin-top:6px">Table na kailangan sa Supabase: store_sync (id text primary key, data jsonb, updated_at timestamptz).</p>' +
  '</div>' +
  '<p class="foot">' + esc(settings.storeName) + ' \u00b7 Cloud Sync</p>';
}
function saveCloud(e){
  e.preventDefault();
  cloud.url     = (document.getElementById('cUrl').value || '').trim() || CLOUD_DEFAULT.url;
  cloud.key     = (document.getElementById('cKey').value || '').trim();
  cloud.storeId = (document.getElementById('cStore').value || '').trim() || CLOUD_DEFAULT.storeId;
  writeStore('cloud', cloud);
  cloudMsg = 'Naka-save ang connection settings.';
  render();
  setCloudMsg(cloudMsg);
  toast('Naka-save ang connection settings.');
  queueCloudSync();
}
function queueCloudSync(){
  if(!cloudReady() || !navigator.onLine) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(function(){ cloudUpload(true); }, 1200);
}
function cloudUpload(background){
  if(!cloudReady()){ setCloudMsg('Kumpletuhin muna ang connection settings.'); return; }
  if(!navigator.onLine){ setCloudMsg('Walang internet \u2014 naka-save pa rin ang data sa device.'); return; }
  if(!background) setCloudMsg('Nag-upload ng data sa cloud\u2026');
  fetch(cloudBase() + '/rest/v1/store_sync', {
    method: 'POST',
    headers: {
      'apikey': cloud.key,
      'Authorization': 'Bearer ' + cloud.key,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({ id: cloud.storeId, data: localData(), updated_at: new Date().toISOString() })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setCloudMsg('Na-upload ang local data sa cloud \u00b7 ' + fmtTime(new Date().toISOString()));
  }).catch(function(err){
    setCloudMsg('Hindi na-upload: ' + ((err && err.message) || 'error'));
  });
}
/* Pagsamahin ang records nang walang doble sa parehong id. */
function mergedList(list, incoming){
  var seen = {}, out = [], added = 0;
  (list || []).forEach(function(x){ if(x && x.id){ seen[x.id] = true; } out.push(x); });
  (incoming || []).forEach(function(x){
    if(!x || !x.id || seen[x.id]) return;
    seen[x.id] = true;
    out.push(x);
    added++;
  });
  return { list: out, added: added };
}
function cloudDownload(){
  if(!cloudReady()){ setCloudMsg('Kumpletuhin muna ang connection settings.'); return; }
  if(!navigator.onLine){ setCloudMsg('Walang internet \u2014 hindi maka-download.'); return; }
  setCloudMsg('Nag-download ng data\u2026');
  var url = cloudBase() + '/rest/v1/store_sync?id=eq.' + encodeURIComponent(cloud.storeId) + '&select=*';
  fetch(url, { headers: { 'apikey': cloud.key, 'Authorization': 'Bearer ' + cloud.key } })
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(rows){
      var added = 0, m, cloudUsers = loadUsers();
      (rows || []).forEach(function(row){
        var d = row && row.data;
        if(!d) return;
        m = mergedList(cloudUsers, d.users);    cloudUsers = m.list; added += m.added;
        m = mergedList(products, d.products);   products  = m.list; added += m.added;
        m = mergedList(sales, d.sales);         sales     = m.list; added += m.added;
        m = mergedList(accounts, d.accounts);   accounts  = m.list; added += m.added;
        m = mergedList(utangTxns, d.utang);     utangTxns = m.list; added += m.added;
        m = mergedList(gcash, d.gcash);         gcash     = m.list; added += m.added;
        if(d.settings){
          settings.storeName   = settings.storeName   || d.settings.storeName;
          settings.managerCode = settings.managerCode || d.settings.managerCode;
          settings.counter = Math.max(Number(settings.counter) || 1, Number(d.settings.counter) || 1);
        }
      });
      saveUsers(cloudUsers);
      persist(true);
      render();
      setCloudMsg(added + ' record(s) ang na-download mula sa cloud.');
      toast(added + ' record(s) na-download.');
    })
    .catch(function(err){
      setCloudMsg('Hindi na-download: ' + ((err && err.message) || 'error'));
    });
}

/* ================= settings ================= */
function viewSettings(){
  return '' +
  '<div class="page-head"><div><h1 class="h1">Settings</h1><p class="sub">Tindahan, backup at data</p></div></div>' +
  '<div class="card"><h2 class="h2">Tindahan</h2>' +
    '<form onsubmit="saveSettings(event)">' +
      '<label class="lbl">Pangalan ng tindahan</label>' +
      '<input id="stName" class="input" value="' + esc(settings.storeName) + '">' +
      '<label class="lbl">Manager code</label>' +
      '<input id="stCode" class="input" inputmode="numeric" value="' + esc(settings.managerCode) + '">' +
      '<button class="btn btn-primary btn-block" style="margin-top:12px" type="submit">I-save</button>' +
    '</form></div>' +
  '<div class="card" style="margin-top:12px"><h2 class="h2">Backup</h2>' +
    '<p class="m-text">I-export ang lahat ng data sa isang file, o i-import pabalik.</p>' +
    '<div class="m-actions" style="margin-top:12px">' +
      '<button class="btn btn-ghost" onclick="exportBackup()">Export</button>' +
      '<button class="btn btn-ghost" onclick="document.getElementById(\'importFile\').click()">Import</button>' +
    '</div>' +
    '<input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)">' +
    '<div class="hr"></div>' +
    '<p class="row-sub">' + products.length + ' products \u00b7 ' + sales.length + ' sales \u00b7 ' + accounts.length + ' accounts \u00b7 ' + utangTxns.length + ' utang records</p>' +
  '</div>' +
  '<div class="card" style="margin-top:12px"><h2 class="h2">Danger Zone</h2>' +
    '<p class="m-text">Buburahin ang lahat ng records sa device na ito.</p>' +
    '<button class="btn btn-danger btn-block" style="margin-top:12px" onclick="resetData()">Burahin ang lahat ng data</button>' +
  '</div>' +
  '<p class="foot">' + esc(settings.storeName) + ' \u00b7 Offline POS \u00b7 gumagana kahit walang internet</p>';
}
function saveSettings(e){
  e.preventDefault();
  settings.storeName = (document.getElementById('stName').value || '').trim() || 'Queeny Store';
  settings.managerCode = (document.getElementById('stCode').value || '').trim() || '3105';
  persist(); render(); toast('Na-save ang settings.');
}
function exportBackup(){
  var data = {
    products: products, sales: sales, accounts: accounts, utang: utangTxns,
    gcash: gcash, settings: settings, exported: new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'queeny-store-backup-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('Na-export ang backup.');
}
function importBackup(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var d = JSON.parse(reader.result);
      if(!d || typeof d !== 'object') throw new Error('bad');
      products  = d.products  || [];
      sales     = d.sales     || [];
      accounts  = d.accounts  || [];
      utangTxns = d.utang     || [];
      gcash     = d.gcash     || [];
      settings  = Object.assign(settings, d.settings || {});
      persist();
      render();
      toast('Na-import ang backup.');
    }catch(e){
      alert('Hindi mabasa ang backup file.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}
function resetData(){
  askCode('Buburahin LAHAT ng data sa device na ito. Sigurado ka?', function(){
    products = []; sales = []; accounts = []; utangTxns = []; gcash = [];
    settings = { storeName: settings.storeName, managerCode: settings.managerCode, counter: 1 };
    persist();
    cart = [];
    render();
    toast('Nabura ang lahat ng data.');
  });
}

window.addEventListener('hashchange', render);
window.addEventListener('online', function(){ queueCloudSync(); });
window.addEventListener('offline', function(){ setCloudMsg('Walang internet \u2014 naka-save pa rin ang data sa device.'); });
render();

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
